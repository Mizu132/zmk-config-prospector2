# Prospector Scanner - Touch Mode Override
# This file is applied on top of prospector_scanner.conf
# Enables touch panel with swipe navigation and settings screens

# Enable touch mode
CONFIG_PROSPECTOR_TOUCH_ENABLED=y
CONFIG_INPUT_CST816S=y

# Force the driver to poll the touch status on a timer interval instead of relying on the hardware interrupt line
CONFIG_INPUT_CST816S_INTERRUPT=n
CONFIG_INPUT_CST816S_PERIOD=30

# Disable strict silicon identifier testing to prevent the CST816T variant from failing the driver check
CONFIG_CST816S_CHECK_CHIP_ID=n

# Layer slide animation (can be toggled at runtime via Display Settings)
# To enable by default: CONFIG_PROSPECTOR_LAYER_SLIDE_DEFAULT=y
